name: CI events

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: events_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: 'true'
      LOG_LEVEL: silent
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/events_test

    steps:
      - name: Descargar código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # La versión de pnpm sale de "packageManager" en package.json.
      - name: Instalar pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests (con reporte JUnit)
        run: pnpm test --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml

      - name: Build
        run: pnpm build

      - name: Subir artifact del servicio
        uses: actions/upload-artifact@v7
        with:
          name: events-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/
            migrations/
            scripts/
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            .env.example
            README.md
          # upload-artifact ignora archivos que empiezan con punto; sin esto se pierde .env.example.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Subir reporte de pruebas
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: events-tests-${{ github.sha }}-${{ github.run_attempt }}
          path: reports/junit.xml
          if-no-files-found: warn
          retention-days: 30
